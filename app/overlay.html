<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Gladius HUD</title>
<style>
/* Grundfarbe Rot; Grün = Ist liegt im Soll-Bereich */
:root { --c: #ff2b2b; --ok: #6dff9a; --s: 1; --o: .92; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
body { font-family: "Segoe UI", system-ui, sans-serif; user-select: none; cursor: none; }
.b { position: absolute; color: var(--c); opacity: var(--o); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums;
     text-shadow: 0 0 2px #000, 0 0 3px #000, 0 1px 8px rgba(0,0,0,.85); white-space: nowrap; }
.ok { color: var(--ok); }
.l { font-size: calc(15px * var(--s)); letter-spacing: .2em; font-weight: 700; }
.v { font-size: calc(88px * var(--s)); }
.u { font-size: calc(24px * var(--s)); margin-left: calc(6px * var(--s)); font-weight: 700; }
.half { font-size: calc(44px * var(--s)); margin-top: calc(4px * var(--s)); }
.half .u { font-size: calc(18px * var(--s)); }
.sub { font-size: calc(18px * var(--s)); font-weight: 700; margin-top: calc(6px * var(--s)); }
.tl { top: 3.5vh; left: 2.5vw; }
.tr { top: 3.5vh; right: 2.5vw; text-align: right; }
.tc { top: 3.5vh; left: 50%; transform: translateX(-50%); text-align: center; }
.bl { bottom: 4.5vh; left: 2.5vw; }
.mid { font-size: calc(72px * var(--s)); }
#chartwrap { position: absolute; left: 50%; bottom: 3vh; transform: translateX(-50%); width: calc(84vw * var(--s)); max-width: 95vw; height: calc(16vh * var(--s)); opacity: var(--o); }
#chart { width: 100%; height: 100%; display: block; }
#prog { position: absolute; left: 0; bottom: 0; height: calc(6px * var(--s)); width: 0; background: var(--c); opacity: calc(var(--o) * .85); box-shadow: 0 0 6px rgba(0,0,0,.8); }
#pause { top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: calc(72px * var(--s)); letter-spacing: .2em; display: none; }
.flash { animation: f .5s steps(2) infinite; } @keyframes f { 50% { opacity: .25; } }
</style>
</head>
<body>
  <!-- oben links: Ist-Leistung gross, Soll halb so gross darunter -->
  <div class="b tl"><div class="l">LEISTUNG</div>
    <div id="pw-ist"><span class="v" id="power">–</span><span class="u">W</span></div>
    <div class="half" id="pw-soll"><span class="l">SOLL </span><span id="target">–</span><span class="u">W</span></div>
    <div class="sub" id="seg"></div></div>
  <!-- oben mitte: verbleibende Intervallzeit -->
  <div class="b tc"><div class="l" id="seglbl">INTERVALL</div><div class="mid" id="segtime">–</div><div class="sub" id="msg"></div><div class="sub" id="next"></div><div class="sub" id="total"></div></div>
  <!-- oben rechts: Ist-Kadenz gross, Soll-Kadenz halb so gross darunter -->
  <div class="b tr"><div class="l">KADENZ</div>
    <div id="cad-ist"><span class="v" id="cad">–</span><span class="u">rpm</span></div>
    <div class="half" id="cad-soll"><span class="l">SOLL </span><span id="cadt">–</span><span class="u">rpm</span></div>
    <div class="sub" id="mode"></div></div>
  <!-- unten mitte: Workout-Diagramm -->
  <div id="chartwrap"><canvas id="chart"></canvas></div>
  <div class="b" id="pause">PAUSE</div>
  <div id="prog"></div>
<script>
const $ = id => document.getElementById(id);
const fmt = s => { if (s == null) return '–'; s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}` : `${m}:${String(x).padStart(2, '0')}`; };
const zoneHex = pct => pct < 55 ? '#6b7787' : pct < 76 ? '#3d8bfd' : pct < 91 ? '#3ecf8e' : pct < 106 ? '#ffc53d' : pct < 121 ? '#ff8a3d' : '#ff4d6a';
let lastAt = 0, prof = null, trace = [], last = null, rEle = null, rStep = 25;
const gradeColor = g => g < 3 ? '#3ecf8e' : g < 6 ? '#ffc53d' : g < 9 ? '#ff8a3d' : '#ff4d6a';

function drawChart(s) {
  const c = $('chart'), d = window.devicePixelRatio || 1, r = c.getBoundingClientRect();
  if (c.width !== Math.round(r.width * d) || c.height !== Math.round(r.height * d)) { c.width = Math.round(r.width * d); c.height = Math.round(r.height * d); }
  const ctx = c.getContext('2d'), W = r.width, H = r.height; ctx.setTransform(d, 0, 0, d, 0, 0); ctx.clearRect(0, 0, W, H);
  if (s.active && s.route && rEle) { drawRoute(ctx, W, H, s.route); return; }
  if (!s.active || !prof || !s.T) return;
  const T = s.T, ftp = s.ftp || 200, padR = 110, PW = W - padR, top = 22;          // rechts Platz für die Werte-Etiketten
  const maxW = Math.max(ftp * 1.3, ...prof.map(p => Math.max(p.a, p.b)).filter(x => x < ftp * 3), ...trace.map(p => p[1] || 0)) * 1.08;
  const X = t => Math.min(t, T) / T * PW, Y = v => H - Math.min(v, maxW) / maxW * (H - top);
  // Puls auf eigener Skala über die ganze Höhe
  const hrs = trace.map(p => p[2]).filter(v => v != null).concat(s.hr != null ? [s.hr] : []);
  let hLo = hrs.length ? Math.min(...hrs) - 10 : 60, hHi = hrs.length ? Math.max(...hrs) + 10 : 180; if (hHi - hLo < 50) { const m = (hLo + hHi) / 2; hLo = m - 25; hHi = m + 25; }
  const Yh = v => H - (v - hLo) / (hHi - hLo) * (H - top);
  let t = 0;
  for (const p of prof) {
    ctx.fillStyle = p.g ? 'rgba(169,139,255,.55)' : zoneHex((p.a + p.b) / 2 / ftp * 100) + '99';
    ctx.beginPath(); ctx.moveTo(X(t), H); ctx.lineTo(X(t), Y(p.a)); ctx.lineTo(X(t + p.d), Y(p.b)); ctx.lineTo(X(t + p.d), H); ctx.fill(); t += p.d;
  }
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.setLineDash([5, 5]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, Y(ftp)); ctx.lineTo(PW, Y(ftp)); ctx.stroke(); ctx.setLineDash([]);
  const path = (pts, Yf) => { ctx.beginPath(); let pen = false; pts.forEach(([x, v]) => { if (v == null) { pen = false; return; } pen ? ctx.lineTo(X(x), Yf(v)) : ctx.moveTo(X(x), Yf(v)); pen = true; }); };
  const stroke = (col, w) => { ctx.lineJoin = 'round'; ctx.lineWidth = w + 2.5; ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.stroke(); ctx.lineWidth = w; ctx.strokeStyle = col; ctx.stroke(); };
  path(trace.map(p => [p[0], p[2]]), Yh); stroke('#ff3b3b', 2.5);
  path(trace.map(p => [p[0], p[1]]), Y); stroke('#ffffff', 2.5);
  // aktueller Zeitpunkt: oranger Punkt auf der Leistung, roter Punkt auf dem Puls, Werte daneben
  const xn = X(s.elapsed), dot = (y, col) => { ctx.beginPath(); ctx.arc(xn, y, 7, 0, 7); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#000'; ctx.stroke(); };
  const label = (y, txt, col) => { ctx.font = '800 20px "Segoe UI",system-ui,sans-serif'; ctx.textBaseline = 'middle'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.strokeText(txt, xn + 14, y); ctx.fillStyle = col; ctx.fillText(txt, xn + 14, y); };
  const pNow = s.power ?? (trace.length ? trace[trace.length - 1][1] : null);
  let yP = pNow != null ? Y(pNow) : null, yH = s.hr != null ? Yh(s.hr) : null;
  if (yP != null && yH != null && Math.abs(yP - yH) < 22) { const m = (yP + yH) / 2, sgn = yP <= yH ? -1 : 1; yP = m + sgn * 11; yH = m - sgn * 11; }   // Etiketten nicht überlappen
  if (s.hr != null) { dot(Yh(s.hr), '#ff3b3b'); label(clamp(yH, 10, H - 10), `${s.hr} bpm${s.zone ? ' · ' + s.zone : ''}`, '#ff3b3b'); }
  if (pNow != null) { dot(Y(pNow), '#ff7a2f'); label(clamp(yP, 10, H - 10), `${pNow} W`, '#ffffff'); }
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// Höhenprofil der Strecke, nach Steigung eingefärbt, oranger Punkt an der aktuellen Position
function drawRoute(ctx, W, H, rt) {
  const len = (rEle.length - 1) * rStep, lo = Math.min(...rEle), hi = Math.max(...rEle), pad = Math.max(20, (hi - lo) * .06), top = 24, PW = W - 120;
  const X = dd => dd / len * PW, Y = e => H - (e - lo + pad) / (hi - lo + 2 * pad) * (H - top);
  const eAt = dd => { const i = clamp(dd / rStep, 0, rEle.length - 1), a = Math.floor(i), b = Math.min(rEle.length - 1, a + 1); return rEle[a] + (rEle[b] - rEle[a]) * (i - a); };
  const seg = Math.max(rStep, len / 200);
  for (let x = 0; x < len; x += seg) { const x2 = Math.min(len, x + seg), g = (eAt(x2) - eAt(x)) / (x2 - x) * 100;
    ctx.globalAlpha = x < rt.pos ? .9 : .5; ctx.fillStyle = gradeColor(g); ctx.beginPath(); ctx.moveTo(X(x), H); ctx.lineTo(X(x), Y(eAt(x))); ctx.lineTo(X(x2), Y(eAt(x2))); ctx.lineTo(X(x2), H); ctx.fill(); }
  ctx.globalAlpha = 1;
  ctx.beginPath(); for (let x = 0; x <= len; x += seg) x ? ctx.lineTo(X(x), Y(eAt(x))) : ctx.moveTo(0, Y(eAt(0)));
  ctx.lineWidth = 4.5; ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.stroke(); ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
  const px = X(rt.pos), py = Y(eAt(rt.pos));
  ctx.beginPath(); ctx.arc(px, py, 8, 0, 7); ctx.fillStyle = '#ff7a2f'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#000'; ctx.stroke();
  ctx.font = '800 20px "Segoe UI",system-ui,sans-serif'; ctx.textBaseline = 'middle'; const txt = `${rt.grade.toFixed(1)} %`;
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.85)'; ctx.strokeText(txt, px + 14, py - 4); ctx.fillStyle = gradeColor(rt.grade); ctx.fillText(txt, px + 14, py - 4);
}

function update(s) {
  lastAt = Date.now(); last = s;
  const r = document.documentElement.style;
  r.setProperty('--s', s.scale || 1); r.setProperty('--o', s.opacity || .92);
  document.body.style.visibility = 'visible';
  if (s.prof) prof = s.prof;
  if (s.trace) trace = s.trace;
  if (s.route && s.route.ele) { rEle = s.route.ele; rStep = s.route.step; }
  if (!s.route) rEle = null;
  if (!s.active) {
    $('power').textContent = s.power ?? '–'; $('target').textContent = '–'; $('cad').textContent = s.cad ?? '–'; $('cadt').textContent = '–';
    $('pw-ist').className = ''; $('cad-ist').className = ''; $('pw-soll').style.visibility = 'hidden'; $('cad-soll').style.visibility = 'hidden';
    $('seg').textContent = 'Kein Training aktiv'; $('seglbl').textContent = 'GLADIUS'; $('segtime').textContent = ''; $('msg').textContent = ''; $('next').textContent = '';
    $('mode').textContent = ''; $('total').textContent = ''; $('prog').style.width = '0'; $('pause').style.display = 'none';
    prof = null; trace = []; drawChart(s); return;
  }
  // Leistung: grün im Soll-Bereich (±5 %), sonst rot; im Gang-Modus gibt es kein Soll
  $('power').textContent = s.power ?? '–';
  const pwOk = !s.gm && s.target && s.power != null && Math.abs(s.power - s.target) / s.target <= 0.05;
  $('pw-ist').className = pwOk ? 'ok' : '';
  $('pw-soll').style.visibility = 'visible';
  $('pw-soll').firstElementChild.textContent = s.route ? 'STEIGUNG ' : 'SOLL ';
  $('pw-soll').lastElementChild.textContent = s.route ? '%' : 'W';
  $('target').textContent = s.route ? s.route.grade.toFixed(1) : s.gm ? 'frei' : (s.target ?? '–');
  $('seg').textContent = s.segLabel || '';
  // Kadenz: grün innerhalb ±5 rpm der Vorgabe
  $('cad').textContent = s.cad ?? '–';
  const cadOk = s.cadTarget && s.cad != null && Math.abs(s.cad - s.cadTarget) <= 5;
  $('cad-ist').className = cadOk ? 'ok' : '';
  $('cad-soll').style.visibility = s.cadTarget ? 'visible' : 'hidden';
  $('cadt').textContent = s.cadTarget ?? '–';
  $('mode').textContent = s.gm ? `GANG ${s.gear}/${s.gears}` : `ERG ${s.intensity}%`;
  // Intervallzeit oben mitte
  $('seglbl').textContent = s.route ? 'NOCH' : s.segRem == null ? 'DAUER' : 'INTERVALL NOCH';
  $('segtime').textContent = s.route ? (s.route.left / 1000).toFixed(2) + ' km' : s.segRem == null ? fmt(s.elapsed) : fmt(s.segRem);
  $('segtime').className = 'mid' + (s.flash ? ' flash' : '');
  $('msg').textContent = s.msg || '';
  $('next').textContent = s.route ? `HÖHE ${s.route.alt} M · NOCH ${Math.max(0, s.route.top - s.route.alt)} HM · ${fmt(s.elapsed)}` : (s.next || '');
  $('total').textContent = s.totalRem == null ? '' : `WORKOUT NOCH ${fmt(s.totalRem)}`;
  $('prog').style.width = ((s.progress || 0) * 100).toFixed(2) + '%';
  $('pause').style.display = s.paused ? 'block' : 'none';
  drawChart(s);
}
if (window.overlayBridge) window.overlayBridge.onHud(update);
addEventListener('resize', () => { if (last) drawChart(last); });
// Kommen 5 s lang keine Daten (App geschlossen/abgestürzt), HUD ausblenden statt alte Werte zu zeigen
setInterval(() => { if (Date.now() - lastAt > 5000) document.body.style.visibility = 'hidden'; }, 1000);
document.body.style.visibility = 'hidden';
</script>
</body>
</html>
